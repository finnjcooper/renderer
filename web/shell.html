<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>COMS30020 Renderer</title>

    <style>
        html, body {
            margin: 0;
            min-height: 100%;
            background: #222;
        }

        body {
            display: grid;
            place-items: center;
            min-height: 100vh;
        }

        .canvases {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 16px;
        }

        .canvas-frame {
            position: relative;
            width: min(640px, 95vw);
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
        }

        .fps-counter {
            position: absolute;
            top: 8px;
            left: 8px;
            padding: 4px 7px;
            border-radius: 4px;
            background: rgb(0 0 0 / 70%);
            color: #fff;
            font: 14px/1.2 sans-serif;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="canvases">
        <!-- <div class="canvas-frame">
            <canvas id="canvas"></canvas>
            <span class="fps-counter" id="canvas-fps">FPS --</span>
        </div> -->
        <div class="canvas-frame">
            <canvas id="webgpu-canvas"
                    width="1280"
                    height="720">
            </canvas>
            <span class="fps-counter" id="webgpu-canvas-fps">FPS --</span>
        </div>
    </div>
    {{{ SCRIPT }}}
</body>
</html>
